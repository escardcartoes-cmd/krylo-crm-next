name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          FLASK_URL: https://web-production-7599a.up.railway.app

      - name: Audit npm packages (high severity blocks)
        run: npm audit --audit-level=high --production
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # Flask backend for the smoke test is booted inline in a step below (see "Boot Flask").
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout Flask backend
        uses: actions/checkout@v4
        with:
          repository: escardcartoes-cmd/escard-crm
          path: backend

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot Flask
        working-directory: backend
        env:
          SECRET_KEY: e2e-ci-secret-not-for-prod
          SCHEDULER_OFF: "1"
          PORT: "5001"
        run: |
          python app.py > /tmp/flask.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:5001/api/me && break
            sleep 1
          done

      - name: Install Next deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Next.js
        env:
          FLASK_URL: http://localhost:5001
        run: |
          npm run dev -- --port 3001 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3001 && break
            sleep 1
          done

      - name: Playwright smoke
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          E2E_USER: admin
          E2E_PASS: testpass123
        run: npx playwright test
        continue-on-error: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Detect leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
